version: "3.9"

# Optional: run Postgres (with pgvector) + Redis in Docker Desktop.
# Spring Boot, FastAPI and React still run locally via mvn / uvicorn / npm.
#
# Usage:
#   docker compose up -d
#   docker compose down          (stop)
#   docker compose down -v       (stop and wipe data)

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_docs_db
      POSTGRES_USER: ai_app_user
      POSTGRES_PASSWORD: ai_app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_app_user -d ai_docs_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-app-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
