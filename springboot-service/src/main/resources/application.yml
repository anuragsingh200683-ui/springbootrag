server:
  port: 8090

spring:
  application:
    name: aiapp-springboot-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_docs_db
    username: ai_app_user
    password: ai_app_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # IMPORTANT: ddl-auto is a single global setting for the whole persistence unit -
      # Hibernate does NOT scope it per package or per entity. It applies equally to
      # com.example.aiapp.entity, com.example.aiapp.transaction.entity, and
      # com.example.employeemanagement, all of which are on @EntityScan together
      # (see AiAppApplication.java).
      #
      # 'update' is safe today only because of how each group's schema is actually
      # sourced, not because of any scoping:
      #   - aiapp entities (Document, QaHistory) are mapped to match the tables
      #     sql-scripts/init.sql already creates by hand, so 'update' finds nothing to
      #     change and is a no-op for them.
      #   - com.example.aiapp.transaction entities have no init.sql definition at all -
      #     they rely entirely on 'update' to create their tables.
      #   - com.example.employeemanagement (EMS) entities are the same: Hibernate-only,
      #     no init.sql definitions.
      # If an aiapp/transaction entity mapping is ever changed without updating
      # sql-scripts/init.sql to match, Hibernate will silently ALTER those hand-managed
      # tables on next startup instead of failing loudly - keep the two in sync by hand.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # This service only validates JWTs issued by the external auth server (Keycloak realm
  # 'aiapp', see keycloak/README.md). Signing keys are fetched from the issuer's JWKS
  # endpoint and cached; iss, aud and exp/nbf are checked on every request.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8180/realms/aiapp}
          audiences: aiapp-api

app:
  security:
    jwt:
      # Dot-path of the claim holding role names; each becomes ROLE_<name>.
      roles-claim: realm_access.roles
  storage:
    upload-dir: ./uploaded_files
  fastapi:
    base-url: http://localhost:8000
    timeout-ms: 60000
  cache:
    qa-ttl-seconds: 3600
  openai:
    # Must be set as a real environment variable - never commit a live key here.
    api-key: ${OPENAI_API_KEY:}
    chat-model: gpt-4o-mini
    embedding-model: text-embedding-3-small
  qa:
    chunk-size: 1000
    chunk-overlap: 150
    top-k: 4
  transaction:
    shipping:
      # ISO-3166 alpha-2 codes the demo carrier serves. Anything else makes
      # scheduleShipment fail, which is how the compensation path is exercised.
      serviceable-countries: IN,US,GB,DE
    demo:
      # Only consulted when the 'saga-demo' profile is active.
      seed-data: true
    compensation:
      # Retries apply only to transient database/connection errors.
      max-attempts: 3
      # Wait before retry n is backoff * n.
      backoff: 150ms
      # Total retry time for one compensation run; after that, each remaining step gets one attempt.
      retry-budget: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.example.aiapp: DEBUG
    com.example.aiapp.transaction: DEBUG
  file:
    name: logs/springboot-service.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
